# ==============================================================================
# ApLite 极速轻量分流配置 (Subconverter 远程规则与策略组模板)
# 适合入门级路由器、便携随身 WiFi 或低内存极简环境
# 仓库地址: https://github.com/Apocalypse-Long/clash
# ==============================================================================

[custom]

; ------------------------------------------------------------------------------
; 1、域名组 (自上而下匹配，优先级由高到低)
; ------------------------------------------------------------------------------

; 【个人定制】你的自定义规则优先级最高
ruleset=🇨🇳 国内直连,https://raw.githubusercontent.com/Apocalypse-Long/clash/main/rules/custom-direct.list
ruleset=🇨🇳 国内直连,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/refs/heads/master/rule/Clash/Dell/Dell.list

ruleset=🌐 国外代理,https://raw.githubusercontent.com/Apocalypse-Long/clash/main/rules/custom-proxy.list

; 【指定分离的服务】按需独立控制节点或直连
ruleset=🔍 Google,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/refs/heads/master/rule/Clash/Google/Google.list
ruleset=🪟 微软服务,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/refs/heads/master/rule/Clash/Microsoft/Microsoft.list
ruleset=🐙 GitHub,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/refs/heads/master/rule/Clash/GitHub/GitHub.list
ruleset=🎮 Steam,https://raw.githubusercontent.com/Apocalypse-Long/clash/main/rules/gaming.list
ruleset=🎮 Steam,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/refs/heads/master/rule/Clash/Steam/Steam.list
ruleset=📥 PT站,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/refs/heads/master/rule/Clash/PrivateTracker/PrivateTracker.list

; 【风控严格与特定服务】
ruleset=💳 跨境支付,[]DOMAIN-SUFFIX,giffgaff.com
ruleset=💳 跨境支付,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/refs/heads/master/rule/Clash/PayPal/PayPal.list
ruleset=🤖 AI服务,https://raw.githubusercontent.com/Apocalypse-Long/clash/main/rules/ai.list
ruleset=🎵 TikTok,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/refs/heads/master/rule/Clash/TikTok/TikTok.list
ruleset=✈️ Telegram,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/refs/heads/master/rule/Clash/Telegram/Telegram.list
ruleset=🍎 苹果服务,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/refs/heads/master/rule/Clash/Apple/Apple.list

; 【全局海外兜底】包含所有未单独列出的海外网站与测速工具
ruleset=🌐 国外代理,https://raw.githubusercontent.com/Apocalypse-Long/clash/main/rules/check.list
ruleset=🌐 国外代理,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/refs/heads/master/rule/Clash/Global/Global.list

; 【最终保底策略】其余所有未知流量默认走国内直连
ruleset=🇨🇳 国内直连,[]FINAL

; ------------------------------------------------------------------------------
; 2、策略组 (精简高效，首位为默认选中代理)
; ------------------------------------------------------------------------------
custom_proxy_group=🌐 国外代理`select`[]⚡ 港日新-自动`[]⚡ 所有-自动`[]🇭🇰 香港-自动`[]🇸🇬 新加坡-自动`[]🇯🇵 日本-自动`[]🇺🇸 美国-自动`[]🇬🇧 英国-自动`[]🖐️ 所有-手动
custom_proxy_group=🔍 Google`select`[]🇺🇸 美国-自动`[]⚡ 港日新-自动`[]⚡ 所有-自动`[]🇭🇰 香港-自动`[]🇸🇬 新加坡-自动`[]🇯🇵 日本-自动`[]🖐️ 所有-手动
custom_proxy_group=🪟 微软服务`select`[]🇺🇸 美国-自动`[]DIRECT`[]🌐 国外代理`[]⚡ 所有-自动`[]🖐️ 所有-手动
custom_proxy_group=🐙 GitHub`select`[]⚡ 港日新-自动`[]⚡ 所有-自动`[]🇭🇰 香港-自动`[]🇸🇬 新加坡-自动`[]🇯🇵 日本-自动`[]🇺🇸 美国-自动`[]🖐️ 所有-手动
custom_proxy_group=🎮 Steam`select`[]🇭🇰 香港-自动`[]DIRECT`[]🌐 国外代理`[]⚡ 所有-自动`[]🖐️ 所有-手动
custom_proxy_group=📥 PT站`select`[]DIRECT`[]🌐 国外代理`[]⚡ 所有-自动`[]🖐️ 所有-手动
custom_proxy_group=🤖 AI服务`select`[]🇺🇸 美国-自动`[]🇬🇧 英国-自动`[]🇸🇬 新加坡-自动`[]🇯🇵 日本-自动`[]⚡ 所有-自动`[]🖐️ 所有-手动
custom_proxy_group=💳 跨境支付`select`[]DIRECT`[]🇬🇧 英国-自动`[]🇺🇸 美国-自动`[]⚡ 所有-自动`[]🖐️ 所有-手动
custom_proxy_group=🎵 TikTok`select`[]DIRECT`[]🇺🇸 美国-自动`[]🇬🇧 英国-自动`[]🇸🇬 新加坡-自动`[]🇯🇵 日本-自动`[]🇭🇰 香港-自动`[]⚡ 所有-自动`[]🖐️ 所有-手动
custom_proxy_group=✈️ Telegram`select`[]⚡ 港日新-自动`[]🇭🇰 香港-自动`[]🇸🇬 新加坡-自动`[]🇯🇵 日本-自动`[]⚡ 所有-自动`[]🖐️ 所有-手动
custom_proxy_group=🍎 苹果服务`select`[]DIRECT`[]🌐 国外代理`[]⚡ 所有-自动`[]🖐️ 所有-手动
custom_proxy_group=🇨🇳 国内直连`select`[]DIRECT`[]🌐 国外代理

; ------------------------------------------------------------------------------
; 3、节点组 (保持自动测速与手动选择的极简结合)
; ------------------------------------------------------------------------------
custom_proxy_group=🖐️ 所有-手动`select`.*
custom_proxy_group=⚡ 所有-自动`url-test`.*`https://www.gstatic.com/generate_204`180,50,100
custom_proxy_group=⚡ 港日新-自动`url-test`(香港|HK|Hong Kong|HongKong|🇭🇰|日本|JP|Japan|Tokyo|Osaka|🇯🇵|新加坡|SG|Singapore|Lion|🇸🇬)`https://www.gstatic.com/generate_204`180,50,100
custom_proxy_group=🇭🇰 香港-自动`url-test`(香港|HK|Hong Kong|HongKong|🇭🇰)`https://www.gstatic.com/generate_204`180,50,100
custom_proxy_group=🇯🇵 日本-自动`url-test`(日本|JP|Japan|Tokyo|Osaka|🇯🇵)`https://www.gstatic.com/generate_204`180,50,100
custom_proxy_group=🇸🇬 新加坡-自动`url-test`(新加坡|SG|Singapore|Lion|🇸🇬)`https://www.gstatic.com/generate_204`180,50,100
custom_proxy_group=🇺🇸 美国-自动`url-test`(美国|US|United States|America|美|🇺🇸)`https://www.gstatic.com/generate_204`180,50,100
custom_proxy_group=🇬🇧 英国-自动`url-test`(英国|UK|United Kingdom|Great Britain|英|🇬🇧)`https://www.gstatic.com/generate_204`180,50,100
custom_proxy_group=🌐 其他-自动`url-test`(^(?!.*(香港|HK|Hong Kong|HongKong|🇭🇰|日本|JP|Japan|Tokyo|Osaka|🇯🇵|新加坡|SG|Singapore|Lion|🇸🇬|美国|US|United States|America|美|🇺🇸|英国|UK|United Kingdom|Great Britain|英|🇬🇧)).*)`https://www.gstatic.com/generate_204`180,50,100

; ------------------------------------------------------------------------------
; 4、启用规则集
; ------------------------------------------------------------------------------
enable_rule_generator=true
overwrite_original_rules=true
