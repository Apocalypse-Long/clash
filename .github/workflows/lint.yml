name: Lint rules

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Validate rule list syntax
        run: |
          python - << 'EOF'
          import glob, ipaddress, sys

          files = sorted(glob.glob('list/**/*.list', recursive=True)) + ['personallist.ini', 'personallistout.ini']
          types = {'DOMAIN', 'DOMAIN-SUFFIX', 'DOMAIN-KEYWORD', 'DOMAIN-REGEX',
                   'IP-CIDR', 'IP-CIDR6', 'IP-ASN', 'GEOIP', 'GEOSITE',
                   'SRC-IP-CIDR', 'DST-PORT', 'SRC-PORT', 'PROCESS-NAME', 'USER-AGENT'}
          errors = []
          for path in files:
              with open(path, encoding='utf-8-sig') as f:
                  for n, raw in enumerate(f, 1):
                      line = raw.strip()
                      if not line or line.startswith(('#', ';', '//')):
                          continue
                      parts = [p.strip() for p in line.split(',')]
                      if parts[0] not in types or len(parts) < 2 or not parts[1]:
                          errors.append(f'{path}:{n}: invalid rule: {line}')
                          continue
                      if parts[0] in ('IP-CIDR', 'IP-CIDR6'):
                          try:
                              net = ipaddress.ip_network(parts[1], strict=False)
                          except ValueError:
                              errors.append(f'{path}:{n}: invalid CIDR: {line}')
                              continue
                          if net.version == 4 and net.prefixlen < 8:
                              errors.append(f'{path}:{n}: suspiciously large CIDR /{net.prefixlen}: {line}')
          if errors:
              print('\n'.join(errors)); sys.exit(1)
          print(f'OK: {len(files)} files checked')
          EOF
