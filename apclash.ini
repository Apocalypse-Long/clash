custom_proxy_group=🇯🇵 日本-自动`url-test`(日本|JP|Japan|Tokyo|Osaka|🇯🇵)`https://www.gstatic.com/generate_204`180,50,100
custom_proxy_group=🇸🇬 新加坡-自动`url-test`(新加坡|SG|Singapore|Lion|🇸🇬)`https://www.gstatic.com/generate_204`180,50,100
custom_proxy_group=🇹🇼 台湾-自动`url-test`(台湾|TW|Taiwan|Taipei|🇹🇼)`https://www.gstatic.com/generate_204`180,50,100
custom_proxy_group=🇺🇸 美国-自动`url-test`(美国|US|United States|America|美|🇺🇸)`https://www.gstatic.com/generate_204`180,50,100
custom_proxy_group=🇬🇧 英国-自动`url-test`(英国|UK|United Kingdom|Great Britain|英|🇬🇧)`https://www.gstatic.com/generate_204`180,50,100
custom_proxy_group=🇩🇪 德国-自动`url-test`(德国|DE|Germany|Deutschland|德|🇩🇪)`https://www.gstatic.com/generate_204`180,50,100
custom_proxy_group=🌐 其他-自动`url-test`(^(?!.*(香港|HK|Hong Kong|HongKong|🇭🇰|日本|JP|Japan|Tokyo|Osaka|🇯🇵|新加坡|SG|Singapore|Lion|🇸🇬|台湾|TW|Taiwan|Taipei|🇹🇼|美国|US|United States|America|美|🇺🇸|英国|UK|United Kingdom|Great Britain|英|🇬🇧|德国|DE|Germany|Deutschland|德|🇩🇪)).*)`https://www.gstatic.com/generate_204`180,50,100

