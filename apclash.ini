custom_proxy_group=🇸🇬 新加坡-自动`url-test`(新加坡|狮城|(?<![A-Za-z])(SG|sg|SGP|SIN)(?![A-Za-z])|Singapore|🇸🇬)`https://www.gstatic.com/generate_204`300,50,100
custom_proxy_group=🇹🇼 台湾-自动`url-test`(台湾|台北|(?<![A-Za-z])(TW|tw|TWN|TPE)(?![A-Za-z])|Taiwan|Taipei|🇹🇼)`https://www.gstatic.com/generate_204`300,50,100
custom_proxy_group=🇺🇸 美国-自动`url-test`(美国|洛杉矶|西雅图|圣何塞|硅谷|芝加哥|纽约|(?<![A-Za-z])(US|us|USA|usa|LAX|SJC|SEA|ORD|EWR|IAD)(?![A-Za-z])|United ?States|America|🇺🇸)`https://www.gstatic.com/generate_204`300,50,100
custom_proxy_group=🇬🇧 英国-自动`url-test`(英国|伦敦|(?<![A-Za-z])(UK|uk|GBR|LHR)(?![A-Za-z])|United ?Kingdom|Great ?Britain|🇬🇧)`https://www.gstatic.com/generate_204`300,50,100
custom_proxy_group=🇩🇪 德国-自动`url-test`(德国|法兰克福|(?<![A-Za-z])(DE|de|DEU|FRA)(?![A-Za-z])|Germany|Deutschland|🇩🇪)`https://www.gstatic.com/generate_204`300,50,100
custom_proxy_group=🌐 其他-自动`url-test`(^(?!.*(剩余|流量|到期|官网|套餐|重置|群组|频道|失联|备用网址|香港|(?<![A-Za-z])(HK|hk|HKG|hkg)(?![A-Za-z])|Hong ?Kong|🇭🇰|日本|大阪|东京|(?<![A-Za-z])(JP|jp|JPN|TYO|NRT|KIX)(?![A-Za-z])|Japan|Tokyo|Osaka|🇯🇵|新加坡|狮城|(?<![A-Za-z])(SG|sg|SGP|SIN)(?![A-Za-z])|Singapore|🇸🇬|台湾|台北|(?<![A-Za-z])(TW|tw|TWN|TPE)(?![A-Za-z])|Taiwan|Taipei|🇹🇼|美国|洛杉矶|西雅图|圣何塞|硅谷|芝加哥|纽约|(?<![A-Za-z])(US|us|USA|usa|LAX|SJC|SEA|ORD|EWR|IAD)(?![A-Za-z])|United ?States|America|🇺🇸|英国|伦敦|(?<![A-Za-z])(UK|uk|GBR|LHR)(?![A-Za-z])|United ?Kingdom|Great ?Britain|🇬🇧|德国|法兰克福|(?<![A-Za-z])(DE|de|DEU|FRA)(?![A-Za-z])|Germany|Deutschland|🇩🇪)).*)`https://www.gstatic.com/generate_204`300,50,100

