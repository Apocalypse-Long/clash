# ==============================================================================
# ApClash 旗舰完整分流配置 (Subconverter 远程规则与策略组模板)
# 仓库地址: https://github.com/Apocalypse-Long/clash
# ==============================================================================

[custom]

; ------------------------------------------------------------------------------
; 1、域名与规则集绑定 (按优先级自上而下匹配，首位命中即执行)
; ------------------------------------------------------------------------------

; 【个人最高优先级】自定义国内直连与国外代理
ruleset=🇨🇳 APLIST国内,https://raw.githubusercontent.com/Apocalypse-Long/clash/main/rules/custom-direct.list

ruleset=✈️ APLIST国外,https://raw.githubusercontent.com/Apocalypse-Long/clash/main/rules/custom-proxy.list
ruleset=✈️ APLIST国外,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/refs/heads/master/rule/Clash/Cloudflare/Cloudflare.list

; 【金融风控】PayPal、Stripe、英国SIM卡(Giffgaff)
ruleset=💳 PayPal&Giffgaff,[]DOMAIN-SUFFIX,giffgaff.com
ruleset=💳 PayPal&Giffgaff,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/refs/heads/master/rule/Clash/PayPal/PayPal.list

; 【AI 与大模型】ChatGPT, Claude, Gemini, Grok, Perplexity, Copilot, Cursor 等
ruleset=🤖 AI服务,https://raw.githubusercontent.com/Apocalypse-Long/clash/main/rules/ai.list

; 【加密资产】主流交易所与 Web3 钱包
ruleset=🪙 Crypto,https://raw.githubusercontent.com/Apocalypse-Long/clash/main/rules/crypto.list

; 【全球知名服务独立分流】
ruleset=🐙 GitHub,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/refs/heads/master/rule/Clash/GitHub/GitHub.list
ruleset=🎵 TikTok,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/refs/heads/master/rule/Clash/TikTok/TikTok.list
ruleset=✈️ Telegram,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/refs/heads/master/rule/Clash/Telegram/Telegram.list
ruleset=🐦 Twitter(X),https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/refs/heads/master/rule/Clash/Twitter/Twitter.list
ruleset=📘 Facebook,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/refs/heads/master/rule/Clash/Facebook/Facebook.list
ruleset=📦 Amazon,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/refs/heads/master/rule/Clash/Amazon/Amazon.list
ruleset=🍎 Apple,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/refs/heads/master/rule/Clash/Apple/Apple.list
ruleset=🪟 Microsoft,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/refs/heads/master/rule/Clash/Microsoft/Microsoft.list
ruleset=🔍 Google,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/refs/heads/master/rule/Clash/Google/Google.list
ruleset=📺 YouTube,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/refs/heads/master/rule/Clash/YouTube/YouTube.list
ruleset=🎧 Spotify,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/refs/heads/master/rule/Clash/Spotify/Spotify.list

; 【游戏与下载】Steam、EA、暴雪、PT下载
ruleset=🎮 Steam,https://raw.githubusercontent.com/Apocalypse-Long/clash/main/rules/gaming.list
ruleset=🎮 Steam,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/refs/heads/master/rule/Clash/Steam/Steam.list
ruleset=🕹️ EA Game,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/refs/heads/master/rule/Clash/EA/EA.list
ruleset=📥 PT站,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/refs/heads/master/rule/Clash/PrivateTracker/PrivateTracker.list

; 【全局海外兜底与测速检测】
ruleset=🌐 国外代理,https://raw.githubusercontent.com/Apocalypse-Long/clash/main/rules/check.list
ruleset=🌐 国外代理,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/refs/heads/master/rule/Clash/Global/Global.list

; 【国内直连终极保底】
ruleset=🇨🇳 国内直连,[]FINAL

; ------------------------------------------------------------------------------
; 2、策略分流组 (首个节点为默认选中的代理节点)
; ------------------------------------------------------------------------------

; 核心与个人规则
custom_proxy_group=🇨🇳 APLIST国内`select`[]DIRECT`[]⚡ 港日新-自动`[]⚡ 所有-自动`[]🖐️ 所有-手动`[]REJECT
custom_proxy_group=✈️ APLIST国外`select`[]🇺🇸 美国-自动`[]⚡ 港日新-自动`[]⚡ 所有-自动`[]🇭🇰 香港-自动`[]🇯🇵 日本-自动`[]🇸🇬 新加坡-自动`[]🇬🇧 英国-自动`[]🖐️ 所有-手动`[]DIRECT

; 严格风控服务 (AI/支付/TikTok，默认走专属纯净/合规地区节点)
custom_proxy_group=🤖 AI服务`select`[]🇺🇸 美国-自动`[]🇬🇧 英国-自动`[]🇸🇬 新加坡-自动`[]🇯🇵 日本-自动`[]⚡ 所有-自动`[]🖐️ 所有-手动`[]DIRECT`[]REJECT
custom_proxy_group=💳 PayPal&Giffgaff`select`[]DIRECT`[]🇬🇧 英国-自动`[]🇺🇸 美国-自动`[]🇸🇬 新加坡-自动`[]⚡ 所有-自动`[]🖐️ 所有-手动`[]REJECT
custom_proxy_group=🎵 TikTok`select`[]DIRECT`[]🇺🇸 美国-自动`[]🇬🇧 英国-自动`[]🇯🇵 日本-自动`[]🇸🇬 新加坡-自动`[]🇭🇰 香港-自动`[]⚡ 所有-自动`[]🖐️ 所有-手动`[]REJECT

; 常用国际大厂服务
custom_proxy_group=🔍 Google`select`[]🇺🇸 美国-自动`[]⚡ 港日新-自动`[]🇭🇰 香港-自动`[]🇯🇵 日本-自动`[]🇸🇬 新加坡-自动`[]⚡ 所有-自动`[]🖐️ 所有-手动`[]DIRECT
custom_proxy_group=📺 YouTube`select`[]🇺🇸 美国-自动`[]⚡ 港日新-自动`[]🇭🇰 香港-自动`[]🇯🇵 日本-自动`[]🇸🇬 新加坡-自动`[]⚡ 所有-自动`[]🖐️ 所有-手动`[]DIRECT
custom_proxy_group=🐙 GitHub`select`[]⚡ 港日新-自动`[]🇭🇰 香港-自动`[]🇯🇵 日本-自动`[]🇸🇬 新加坡-自动`[]🇺🇸 美国-自动`[]⚡ 所有-自动`[]🖐️ 所有-手动`[]DIRECT
custom_proxy_group=✈️ Telegram`select`[]⚡ 港日新-自动`[]🇭🇰 香港-自动`[]🇸🇬 新加坡-自动`[]🇯🇵 日本-自动`[]⚡ 所有-自动`[]🖐️ 所有-手动`[]DIRECT
custom_proxy_group=🐦 Twitter(X)`select`[]🇺🇸 美国-自动`[]⚡ 港日新-自动`[]🇭🇰 香港-自动`[]🇯🇵 日本-自动`[]⚡ 所有-自动`[]🖐️ 所有-手动`[]DIRECT
custom_proxy_group=📘 Facebook`select`[]⚡ 港日新-自动`[]🇭🇰 香港-自动`[]🇯🇵 日本-自动`[]🇺🇸 美国-自动`[]⚡ 所有-自动`[]🖐️ 所有-手动`[]DIRECT
custom_proxy_group=📦 Amazon`select`[]⚡ 港日新-自动`[]🇭🇰 香港-自动`[]🇯🇵 日本-自动`[]🇺🇸 美国-自动`[]⚡ 所有-自动`[]🖐️ 所有-手动`[]DIRECT
custom_proxy_group=🎧 Spotify`select`[]⚡ 港日新-自动`[]🇭🇰 香港-自动`[]🇯🇵 日本-自动`[]🇺🇸 美国-自动`[]⚡ 所有-自动`[]🖐️ 所有-手动`[]DIRECT
custom_proxy_group=🪙 Crypto`select`[]⚡ 港日新-自动`[]🇸🇬 新加坡-自动`[]🇯🇵 日本-自动`[]🇭🇰 香港-自动`[]⚡ 所有-自动`[]🖐️ 所有-手动`[]DIRECT

; 推荐国内直连优先的服务 (防封号/网络下载加速)
custom_proxy_group=🍎 Apple`select`[]DIRECT`[]⚡ 港日新-自动`[]🇭🇰 香港-自动`[]🇯🇵 日本-自动`[]🇺🇸 美国-自动`[]⚡ 所有-自动`[]🖐️ 所有-手动
custom_proxy_group=🪟 Microsoft`select`[]🇺🇸 美国-自动`[]DIRECT`[]⚡ 港日新-自动`[]🇭🇰 香港-自动`[]🇯🇵 日本-自动`[]⚡ 所有-自动`[]🖐️ 所有-手动
custom_proxy_group=🎮 Steam`select`[]🇭🇰 香港-自动`[]DIRECT`[]⚡ 港日新-自动`[]🇯🇵 日本-自动`[]🇸🇬 新加坡-自动`[]🇺🇸 美国-自动`[]🖐️ 所有-手动
custom_proxy_group=🕹️ EA Game`select`[]DIRECT`[]⚡ 港日新-自动`[]🇭🇰 香港-自动`[]🇯🇵 日本-自动`[]🇸🇬 新加坡-自动`[]🇺🇸 美国-自动`[]🖐️ 所有-手动
custom_proxy_group=📥 PT站`select`[]DIRECT`[]⚡ 所有-自动`[]🖐️ 所有-手动`[]REJECT

; 详细分流后的全局国外代理与国内直连保底 (置于策略组末尾)
custom_proxy_group=🌐 国外代理`select`[]⚡ 港日新-自动`[]⚡ 所有-自动`[]🇭🇰 香港-自动`[]🇯🇵 日本-自动`[]🇸🇬 新加坡-自动`[]🇺🇸 美国-自动`[]🇬🇧 英国-自动`[]🖐️ 所有-手动`[]DIRECT
custom_proxy_group=🇨🇳 国内直连`select`[]DIRECT`[]🌐 国外代理`[]⚡ 所有-自动

