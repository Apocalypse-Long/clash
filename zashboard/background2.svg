<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%" height="100%">
  <defs>
    <linearGradient id="wave1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e4e46"/>
      <stop offset="100%" stop-color="#2a3854"/>
    </linearGradient>
    
    <linearGradient id="wave2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6e3522"/>
      <stop offset="50%" stop-color="#4a2542"/>
      <stop offset="100%" stop-color="#1c2d3d"/>
    </linearGradient>

    <linearGradient id="wave3" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1f4439"/>
      <stop offset="70%" stop-color="#4a3620"/>
      <stop offset="100%" stop-color="#141a24"/>
    </linearGradient>

    <filter id="softWaveBlur">
      <feGaussianBlur stdDeviation="60"/>
    </filter>
  </defs>

  <!-- 基础底色 -->
  <rect width="1920" height="1080" fill="#121720"/>

  <!-- 波浪形态色层，无点状光源 -->
  <g filter="url(#softWaveBlur)">
    <!-- 顶层流体带 -->
    <path d="M-100,-100 L2020,-100 L2020,450 Q1400,200 960,380 T-100,250 Z" fill="url(#wave1)" opacity="0.75"/>
    
    <!-- 中间交叉流体带 -->
    <path d="M-100,350 Q400,600 960,400 T2020,550 L2020,1180 L-100,1180 Z" fill="url(#wave2)" opacity="0.65"/>
    
    <!-- 底层反向流体带 -->
    <path d="M-100,750 Q600,500 1200,850 T2020,700 L2020,1180 L-100,1180 Z" fill="url(#wave3)" opacity="0.7"/>
  </g>
</svg>
