; ==============================================================================
; ApClash 订阅转换模板 (subconverter)
; https://github.com/Apocalypse-Long/clash
;
; 分流模式: 黑名单模式 —— 只有命中下面规则的流量走代理，其余全部直连 (FINAL → 🇨🇳 国内直连)
; 规则自上而下匹配，命中即停止，所以越具体的规则越要放在前面
; ==============================================================================

; ------------------------------------------------------------------------------
; 1、域名组 (规则集 → 策略组)
; ------------------------------------------------------------------------------

; 个人列表 (最高优先级)
ruleset=🇨🇳 APLIST国内,https://raw.githubusercontent.com/Apocalypse-Long/clash/refs/heads/main/personallist.ini
ruleset=🇨🇳 APLIST国内,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/refs/heads/master/rule/Clash/Dell/Dell.list
ruleset=✈️ APLIST国外,https://raw.githubusercontent.com/Apocalypse-Long/clash/refs/heads/main/personallistout.ini
ruleset=✈️ APLIST国外,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/refs/heads/master/rule/Clash/Cloudflare/Cloudflare.list

; 支付
ruleset=💳 PayPal&Giffgaff,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/refs/heads/master/rule/Clash/PayPal/PayPal.list
ruleset=💳 PayPal&Giffgaff,[]DOMAIN-SUFFIX,giffgaff.com

; AI (放在 Google 之前，保证 Gemini 走 AI 节点)
ruleset=🤖 AI服务,https://raw.githubusercontent.com/Apocalypse-Long/clash/refs/heads/main/list/AI.list
ruleset=🤖 AI服务,https://raw.githubusercontent.com/Apocalypse-Long/clash/refs/heads/main/list/AI2.list
ruleset=🤖 AI服务,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/refs/heads/master/rule/Clash/Gemini/Gemini.list

; 国际服务
ruleset=🐙 GitHub,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/refs/heads/master/rule/Clash/GitHub/GitHub.list
ruleset=🎵 TikTok,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/refs/heads/master/rule/Clash/TikTok/TikTok.list
ruleset=✈️ Telegram,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/refs/heads/master/rule/Clash/Telegram/Telegram.list
ruleset=🐦 Twitter(X),https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/refs/heads/master/rule/Clash/Twitter/Twitter.list
ruleset=📘 Facebook,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/refs/heads/master/rule/Clash/Facebook/Facebook.list
ruleset=📦 Amazon,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/refs/heads/master/rule/Clash/Amazon/Amazon.list
ruleset=🍎 Apple,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/refs/heads/master/rule/Clash/Apple/Apple.list
ruleset=🪟 Microsoft,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/refs/heads/master/rule/Clash/Microsoft/Microsoft.list
; YouTube 必须在 Google 之前：Google.list 包含 googlevideo.com (YouTube 视频流)
ruleset=📺 YouTube,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/refs/heads/master/rule/Clash/YouTube/YouTube.list
ruleset=🔍 Google,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/refs/heads/master/rule/Clash/Google/Google.list
ruleset=🔍 Google,https://raw.githubusercontent.com/Apocalypse-Long/clash/refs/heads/main/list/Gemini.list
ruleset=🎧 Spotify,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/refs/heads/master/rule/Clash/Spotify/Spotify.list

; 下载 / 游戏
ruleset=📥 PT站,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/refs/heads/master/rule/Clash/PrivateTracker/PrivateTracker.list
ruleset=🎮 Steam,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/refs/heads/master/rule/Clash/Steam/Steam.list
ruleset=🕹️ EA Game,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/refs/heads/master/rule/Clash/EA/EA.list

; 其他国外网站
ruleset=🌐 国外代理,https://raw.githubusercontent.com/Apocalypse-Long/clash/refs/heads/main/list/Check.list
ruleset=🌐 国外代理,https://raw.githubusercontent.com/Apocalypse-Long/clash/refs/heads/main/list/Proxy.list
ruleset=🌐 国外代理,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/refs/heads/master/rule/Clash/Global/Global.list

; 兜底：未命中的流量全部直连
ruleset=🇨🇳 国内直连,[]FINAL

; ------------------------------------------------------------------------------
; 2、策略组 (select：第一个选项为默认值)
; ------------------------------------------------------------------------------

; 默认直连
custom_proxy_group=🇨🇳 APLIST国内`select`[]DIRECT`[]⚡ 所有-自动`[]🖐️ 所有-手动`[]⚡ 港日-自动`[]🇭🇰 香港-自动`[]🇯🇵 日本-自动`[]🇺🇸 美国-自动`[]🇬🇧 英国-自动`[]REJECT
custom_proxy_group=💳 PayPal&Giffgaff`select`[]DIRECT`[]⚡ 所有-自动`[]🖐️ 所有-手动`[]🇬🇧 英国-自动`[]🇺🇸 美国-自动`[]⚡ 港日-自动`[]🇭🇰 香港-自动`[]🇯🇵 日本-自动`[]REJECT
custom_proxy_group=🍎 Apple`select`[]DIRECT`[]⚡ 所有-自动`[]🖐️ 所有-手动`[]⚡ 港日-自动`[]🇭🇰 香港-自动`[]🇯🇵 日本-自动`[]🇺🇸 美国-自动`[]🇬🇧 英国-自动`[]REJECT
custom_proxy_group=🪟 Microsoft`select`[]DIRECT`[]⚡ 所有-自动`[]🖐️ 所有-手动`[]⚡ 港日-自动`[]🇭🇰 香港-自动`[]🇯🇵 日本-自动`[]🇺🇸 美国-自动`[]🇬🇧 英国-自动`[]REJECT
custom_proxy_group=📥 PT站`select`[]DIRECT`[]⚡ 所有-自动`[]🖐️ 所有-手动`[]⚡ 港日-自动`[]🇭🇰 香港-自动`[]🇯🇵 日本-自动`[]🇺🇸 美国-自动`[]🇬🇧 英国-自动`[]REJECT
custom_proxy_group=🎮 Steam`select`[]DIRECT`[]⚡ 所有-自动`[]🖐️ 所有-手动`[]⚡ 港日-自动`[]🇭🇰 香港-自动`[]🇯🇵 日本-自动`[]🇺🇸 美国-自动`[]🇬🇧 英国-自动`[]REJECT
