; ------------------------------------------------------------------------------
; 3、节点组 (url-test 参数: 间隔180秒, 超时5秒, 容差100ms)
; \bUS / \bUK 防止误匹配 AUS(澳洲)、UKRAINE(乌克兰) 等节点名
; ------------------------------------------------------------------------------
custom_proxy_group=🖐️ 所有-手动`select`.*
custom_proxy_group=⚡ 所有-自动`url-test`.*`https://www.gstatic.com/generate_204`180,5,100
custom_proxy_group=⚡ 港日-自动`url-test`(香港|HK|Hong|🇭🇰|日本|JP|Japan|🇯🇵)`https://www.gstatic.com/generate_204`180,5,100
custom_proxy_group=🇭🇰 香港-自动`url-test`(香港|HK|Hong|🇭🇰)`https://www.gstatic.com/generate_204`180,5,100
custom_proxy_group=🇯🇵 日本-自动`url-test`(日本|JP|Japan|🇯🇵)`https://www.gstatic.com/generate_204`180,5,100
custom_proxy_group=🇺🇸 美国-自动`url-test`(美国|美|\bUS|United States|🇺🇸)`https://www.gstatic.com/generate_204`180,5,100
custom_proxy_group=🇬🇧 英国-自动`url-test`(英国|英|\bUK(?!R)|United Kingdom|🇬🇧)`https://www.gstatic.com/generate_204`180,5,100
custom_proxy_group=🌐 其他-自动`url-test`(^(?!.*(香港|HK|Hong|🇭🇰|日本|JP|Japan|🇯🇵|美国|美|\bUS|United States|🇺🇸|英国|英|\bUK(?!R)|United Kingdom|🇬🇧)).*)`https://www.gstatic.com/generate_204`180,5,100

; ------------------------------------------------------------------------------
; 4、启用规则集
; ------------------------------------------------------------------------------
enable_rule_generator=true
overwrite_original_rules=true
