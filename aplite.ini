# ==============================================================================
# ApLite 极速轻量分流配置 (Subconverter 远程规则与策略组模板)
# 适合入门级路由器、便携随身 WiFi 或低内存极简环境
# 仓库地址: https://github.com/Apocalypse-Long/clash
# ==============================================================================

[custom]

; ------------------------------------------------------------------------------
; 1、域名组 (自上而下匹配，优先级由高到低)
; ------------------------------------------------------------------------------

; 【个人定制】你的自定义规则优先级最高
ruleset=🇨🇳 国内直连,https://raw.githubusercontent.com/Apocalypse-Long/clash/main/rules/custom-direct.list
ruleset=🌐 国外代理,https://raw.githubusercontent.com/Apocalypse-Long/clash/main/rules/custom-proxy.list

; 【指定分离的服务】按需独立控制节点或直连
ruleset=🔍 Google,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/Google/Google.list
ruleset=🪟 微软服务,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/Microsoft/Microsoft.list
ruleset=🐙 GitHub,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/GitHub/GitHub.list
ruleset=🎮 Steam,https://raw.githubusercontent.com/Apocalypse-Long/clash/main/rules/gaming.list
ruleset=🎮 Steam,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/Steam/Steam.list
ruleset=📥 PT站,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/PrivateTracker/PrivateTracker.list

; 【风控严格与特定服务】
ruleset=💳 跨境支付,[]DOMAIN-SUFFIX,giffgaff.com
ruleset=💳 跨境支付,[]DOMAIN-SUFFIX,stripe.com
ruleset=💳 跨境支付,[]DOMAIN-SUFFIX,stripe.network
ruleset=💳 跨境支付,[]DOMAIN-SUFFIX,stripecdn.com
ruleset=💳 跨境支付,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/PayPal/PayPal.list
ruleset=🤖 AI服务,https://raw.githubusercontent.com/Apocalypse-Long/clash/main/rules/ai.list
ruleset=🎵 TikTok,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/TikTok/TikTok.list
ruleset=✈️ Telegram,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/Telegram/Telegram.list
ruleset=🍎 苹果服务,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/Apple/Apple.list

; 【全局海外兜底】包含所有未单独列出的海外网站与测速工具
ruleset=🌐 国外代理,https://raw.githubusercontent.com/Apocalypse-Long/clash/main/rules/check.list
ruleset=🌐 国外代理,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/Global/Global.list

; 【最终保底策略】其余所有未知流量默认走国内直连
ruleset=🇨🇳 国内直连,[]FINAL

; ------------------------------------------------------------------------------
; 2、策略组 (精简高效，首位为默认选中代理，保留 DIRECT 排障退路)
; ------------------------------------------------------------------------------
custom_proxy_group=🔍 Google`select`[]🇺🇸 美国-自动`[]⚡ 港日新-自动`[]⚡ 所有-自动`[]🇭🇰 香港-自动`[]🇸🇬 新加坡-自动`[]🇯🇵 日本-自动`[]🖐️ 所有-手动`[]DIRECT
custom_proxy_group=🤖 AI服务`select`[]🇺🇸 美国-自动`[]🇬🇧 英国-自动`[]🇸🇬 新加坡-自动`[]🇯🇵 日本-自动`[]⚡ 所有-自动`[]🖐️ 所有-手动`[]DIRECT
custom_proxy_group=🐙 GitHub`select`[]⚡ 港日新-自动`[]⚡ 所有-自动`[]🇭🇰 香港-自动`[]🇸🇬 新加坡-自动`[]🇯🇵 日本-自动`[]🇺🇸 美国-自动`[]🖐️ 所有-手动`[]DIRECT
custom_proxy_group=✈️ Telegram`select`[]⚡ 港日新-自动`[]🇭🇰 香港-自动`[]🇸🇬 新加坡-自动`[]🇯🇵 日本-自动`[]⚡ 所有-自动`[]🖐️ 所有-手动`[]DIRECT
custom_proxy_group=🎵 TikTok`select`[]DIRECT`[]🇺🇸 美国-自动`[]🇬🇧 英国-自动`[]🇸🇬 新加坡-自动`[]🇯🇵 日本-自动`[]🇭🇰 香港-自动`[]⚡ 所有-自动`[]🖐️ 所有-手动
custom_proxy_group=💳 跨境支付`select`[]DIRECT`[]🇬🇧 英国-自动`[]🇺🇸 美国-自动`[]⚡ 所有-自动`[]🖐️ 所有-手动
custom_proxy_group=🪟 微软服务`select`[]🇺🇸 美国-自动`[]DIRECT`[]🌐 国外代理`[]⚡ 所有-自动`[]🖐️ 所有-手动
custom_proxy_group=🍎 苹果服务`select`[]DIRECT`[]🌐 国外代理`[]⚡ 所有-自动`[]🖐️ 所有-手动
custom_proxy_group=🎮 Steam`select`[]🇭🇰 香港-自动`[]DIRECT`[]🌐 国外代理`[]⚡ 所有-自动`[]🖐️ 所有-手动
custom_proxy_group=📥 PT站`select`[]DIRECT`[]🌐 国外代理`[]⚡ 所有-自动`[]🖐️ 所有-手动

; 详细分流后的全局国外代理与国内直连保底 (置于策略组末尾)
custom_proxy_group=🌐 国外代理`select`[]⚡ 港日新-自动`[]⚡ 所有-自动`[]🇭🇰 香港-自动`[]🇸🇬 新加坡-自动`[]🇯🇵 日本-自动`[]🇺🇸 美国-自动`[]🇬🇧 英国-自动`[]🖐️ 所有-手动`[]DIRECT
custom_proxy_group=🇨🇳 国内直连`select`[]DIRECT`[]🌐 国外代理

; ------------------------------------------------------------------------------
; 3、节点组 (词边界精准匹配 + 排除伪节点，300s/50ms/100ms 测速)
; ------------------------------------------------------------------------------
custom_proxy_group=🖐️ 所有-手动`select`(^(?!.*(剩余|流量|到期|官网|套餐|重置|群组|频道|失联|备用网址)).*)
custom_proxy_group=⚡ 所有-自动`url-test`(^(?!.*(剩余|流量|到期|官网|套餐|重置|群组|频道|失联|备用网址)).*)`https://www.gstatic.com/generate_204`300,50,100
custom_proxy_group=⚡ 港日新-自动`url-test`(香港|(?<![A-Za-z])(HK|hk|HKG|hkg)(?![A-Za-z])|Hong ?Kong|🇭🇰|日本|大阪|东京|(?<![A-Za-z])(JP|jp|JPN|TYO|NRT|KIX)(?![A-Za-z])|Japan|Tokyo|Osaka|🇯🇵|新加坡|狮城|(?<![A-Za-z])(SG|sg|SGP|SIN)(?![A-Za-z])|Singapore|🇸🇬)`https://www.gstatic.com/generate_204`300,50,100
custom_proxy_group=🇭🇰 香港-自动`url-test`(香港|(?<![A-Za-z])(HK|hk|HKG|hkg)(?![A-Za-z])|Hong ?Kong|🇭🇰)`https://www.gstatic.com/generate_204`300,50,100
custom_proxy_group=🇯🇵 日本-自动`url-test`(日本|大阪|东京|(?<![A-Za-z])(JP|jp|JPN|TYO|NRT|KIX)(?![A-Za-z])|Japan|Tokyo|Osaka|🇯🇵)`https://www.gstatic.com/generate_204`300,50,100
custom_proxy_group=🇸🇬 新加坡-自动`url-test`(新加坡|狮城|(?<![A-Za-z])(SG|sg|SGP|SIN)(?![A-Za-z])|Singapore|🇸🇬)`https://www.gstatic.com/generate_204`300,50,100
custom_proxy_group=🇺🇸 美国-自动`url-test`(美国|洛杉矶|西雅图|圣何塞|硅谷|芝加哥|纽约|(?<![A-Za-z])(US|us|USA|usa|LAX|SJC|SEA|ORD|EWR|IAD)(?![A-Za-z])|United ?States|America|🇺🇸)`https://www.gstatic.com/generate_204`300,50,100
custom_proxy_group=🇬🇧 英国-自动`url-test`(英国|伦敦|(?<![A-Za-z])(UK|uk|GBR|LHR)(?![A-Za-z])|United ?Kingdom|Great ?Britain|🇬🇧)`https://www.gstatic.com/generate_204`300,50,100
custom_proxy_group=🌐 其他-自动`url-test`(^(?!.*(剩余|流量|到期|官网|套餐|重置|群组|频道|失联|备用网址|香港|(?<![A-Za-z])(HK|hk|HKG|hkg)(?![A-Za-z])|Hong ?Kong|🇭🇰|日本|大阪|东京|(?<![A-Za-z])(JP|jp|JPN|TYO|NRT|KIX)(?![A-Za-z])|Japan|Tokyo|Osaka|🇯🇵|新加坡|狮城|(?<![A-Za-z])(SG|sg|SGP|SIN)(?![A-Za-z])|Singapore|🇸🇬|美国|洛杉矶|西雅图|圣何塞|硅谷|芝加哥|纽约|(?<![A-Za-z])(US|us|USA|usa|LAX|SJC|SEA|ORD|EWR|IAD)(?![A-Za-z])|United ?States|America|🇺🇸|英国|伦敦|(?<![A-Za-z])(UK|uk|GBR|LHR)(?![A-Za-z])|United ?Kingdom|Great ?Britain|🇬🇧)).*)`https://www.gstatic.com/generate_204`300,50,100

; ------------------------------------------------------------------------------
; 4、启用规则集
; ------------------------------------------------------------------------------
enable_rule_generator=true
overwrite_original_rules=true
